<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>airun</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-2: #1c212a;
    --line: #272d38;
    --text: #e6e9ef;
    --muted: #8b94a5;
    --accent: #5b9cf8;
    --accent-dim: #23364f;
    --user: #1f2937;
    --warn: #f0b849;
    --err: #f2545b;
    --ok: #33c481;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa; --panel: #ffffff; --panel-2: #f0f2f6; --line: #dde1e8;
      --text: #14181f; --muted: #5f6875; --accent: #1f6feb; --accent-dim: #dbe8fd;
      --user: #eef1f6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 1fr 300px; height: 100vh; overflow: hidden;
  }

  /* --- main column --- */
  main { display: flex; flex-direction: column; min-width: 0; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { font-weight: 700; letter-spacing: .5px; }
  .brand span { color: var(--accent); }
  .model { font-family: var(--mono); font-size: 12px; color: var(--muted);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .spacer { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
  }
  .pill.on { border-color: var(--accent); color: var(--text); background: var(--accent-dim); }
  .pill input { display: none; }

  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 800px; margin: 0 auto; }

  .msg { margin-bottom: 20px; }
  .role { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
          color: var(--muted); margin-bottom: 5px; }
  .bubble { padding: 11px 14px; border-radius: 10px; background: var(--panel);
            border: 1px solid var(--line); overflow-wrap: anywhere; min-width: 0; }
  .msg.user .bubble { background: var(--user); white-space: pre-wrap; }
  .msg.error .bubble { border-color: var(--err); color: var(--err); white-space: pre-wrap; }

  .actions { display: flex; gap: 4px; margin-top: 5px; opacity: 0; transition: opacity .12s; }
  .msg:hover .actions, .actions:focus-within { opacity: 1; }
  .actions button { padding: 3px 8px; font-size: 12px; font-weight: 500; color: var(--muted);
                    background: none; border-color: transparent; }
  .actions button:hover:not(:disabled) { color: var(--text); border-color: var(--line); }
  body.busy .actions button.needs-idle { display: none; }

  .edit-box { width: 100%; min-height: 80px; resize: vertical; padding: 9px 11px; border-radius: 8px;
              border: 1px solid var(--accent); background: var(--bg); color: var(--text); font: inherit; }
  .edit-row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }

  /* --- rendered markdown --- */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .7em; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.1em 0 .45em; line-height: 1.3; }
  .md h1 { font-size: 1.45em; } .md h2 { font-size: 1.28em; } .md h3 { font-size: 1.12em; }
  .md h4, .md h5, .md h6 { font-size: 1em; }
  .md ul, .md ol { margin: 0 0 .7em; padding-left: 1.5em; }
  .md li { margin: .2em 0; }
  .md li > ul, .md li > ol { margin: .2em 0; }
  .md blockquote { margin: 0 0 .7em; padding: 2px 12px; border-left: 3px solid var(--line);
                   color: var(--muted); }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
  .md a { color: var(--accent); }
  .md code { font-family: var(--mono); font-size: .88em;
             background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .md table { border-collapse: collapse; margin: 0 0 .8em; display: block; overflow-x: auto;
              max-width: 100%; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
  .md th { background: var(--panel-2); font-weight: 600; }

  .codeblock { margin: .5em 0 .9em; border: 1px solid var(--line); border-radius: 8px;
               overflow: hidden; background: var(--panel-2); }
  .codehead { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px;
              border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px;
              color: var(--muted); }
  .codehead .lang { flex: 1; }
  .codehead button { padding: 2px 8px; font-size: 11px; font-weight: 500; }
  .codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto;
                   font-family: var(--mono); font-size: 13px; line-height: 1.5; }
  .codeblock pre code { background: none; padding: 0; font-size: inherit; white-space: pre; }

  /* --- reasoning --- */
  details.think { margin: 0 0 10px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--panel-2); }
  details.think > summary { cursor: pointer; padding: 6px 10px; font-size: 12px;
                            color: var(--muted); list-style: none; user-select: none; }
  details.think > summary::-webkit-details-marker { display: none; }
  details.think > summary::before { content: "▸ "; }
  details.think[open] > summary::before { content: "▾ "; }
  details.think.live > summary { color: var(--accent); }
  .think-body { padding: 2px 12px 10px; font-size: 13.5px; color: var(--muted);
                max-height: 360px; overflow-y: auto; }

  .stats { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
  .cursor::after {
    content: "▍"; color: var(--accent);
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }
  .empty h2 { font-weight: 600; margin: 0 0 6px; color: var(--text); }
  .empty p { margin: 0; font-size: 13px; }

  /* --- composer --- */
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .composer { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea#input {
    flex: 1; resize: none; min-height: 44px; max-height: 220px;
    padding: 11px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; outline: none;
  }
  textarea#input:focus { border-color: var(--accent); }

  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 9px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 11px 16px; white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { border-color: var(--err); color: var(--err); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.small { padding: 5px 10px; font-size: 12px; font-weight: 500; }

  /* --- html preview --- */
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55);
           display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal[hidden] { display: none; }
  .modal-box { width: min(1100px, 100%); height: min(760px, 100%); display: flex; flex-direction: column;
               background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .modal-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
                border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .modal-head .spacer { flex: 1; }
  .modal iframe { flex: 1; border: 0; background: #fff; width: 100%; }

  /* --- settings --- */
  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 14px;
  }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
             color: var(--muted); margin: 18px 0 10px; }
  aside h3:first-child { margin-top: 0; }

  .field { margin-bottom: 13px; }
  .field label { display: flex; justify-content: space-between; align-items: baseline;
                 font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field label b { color: var(--text); font-family: var(--mono); font-weight: 600; font-size: 12px; }
  .field input[type=range] { width: 100%; accent-color: var(--accent); }
  .field input[type=number], .field input[type=text], .field textarea.sys {
    width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 13px; outline: none;
  }
  .field textarea.sys { min-height: 68px; resize: vertical; font-size: 13px; }
  .field input:focus, .field textarea.sys:focus { border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .info { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .info div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .info div span:last-child { color: var(--text); text-align: right; }

  #settingsBtn { display: none; }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    aside { display: none; }
    aside.open { display: block; position: fixed; inset: 0; z-index: 10; }
    #settingsBtn { display: inline-block; }
    .actions { opacity: 1; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="dot" id="dot"></div>
    <div class="brand">ai<span>run</span></div>
    <div class="model" id="modelName">connecting…</div>
    <div class="spacer"></div>
    <label class="pill" id="thinkPill" hidden title="Let the model reason before answering">
      <input type="checkbox" id="think" checked> Thinking
    </label>
    <button class="small" id="settingsBtn">Settings</button>
    <button class="small" id="newChat">New chat</button>
  </header>

  <div id="log">
    <div class="wrap" id="wrap"></div>
  </div>

  <footer>
    <div class="composer">
      <textarea id="input" placeholder="Send a message…" rows="1"></textarea>
      <button class="primary" id="send">Send</button>
      <button class="danger" id="stop" hidden title="Stop (Esc)">Stop</button>
    </div>
  </footer>
</main>

<aside id="aside">
  <h3>Model</h3>
  <div class="info" id="info"></div>

  <h3>Sampling</h3>

  <div class="field">
    <label for="temp">temperature <b id="tempV">0.7</b></label>
    <input type="range" id="temp" min="0" max="2" step="0.05" value="0.7">
    <div class="hint">0 is greedy and reproducible.</div>
  </div>

  <div class="field">
    <label for="top_p">top_p <b id="top_pV">0.95</b></label>
    <input type="range" id="top_p" min="0" max="1" step="0.01" value="0.95">
  </div>

  <div class="field">
    <label for="top_k">top_k <b id="top_kV">40</b></label>
    <input type="range" id="top_k" min="0" max="200" step="1" value="40">
    <div class="hint">0 disables it.</div>
  </div>

  <div class="field">
    <label for="min_p">min_p <b id="min_pV">0.05</b></label>
    <input type="range" id="min_p" min="0" max="0.5" step="0.01" value="0.05">
  </div>

  <div class="field">
    <label for="rep">repeat penalty <b id="repV">1.10</b></label>
    <input type="range" id="rep" min="1" max="1.5" step="0.01" value="1.10">
    <div class="hint">Sent as frequency_penalty = value − 1.</div>
  </div>

  <h3>Limits</h3>

  <div class="field">
    <label for="maxTok">max tokens</label>
    <input type="number" id="maxTok" min="1" max="32768" value="2048">
    <div class="hint">Reasoning counts against this too.</div>
  </div>

  <div class="field">
    <label for="seed">seed</label>
    <input type="text" id="seed" placeholder="random" inputmode="numeric">
    <div class="hint">Fix it with temperature 0 for a repeatable answer.</div>
  </div>

  <h3>System prompt</h3>
  <div class="field">
    <textarea class="sys" id="sys" placeholder="(none)"></textarea>
    <div class="hint">Applied from the next message on.</div>
  </div>

  <h3>Server</h3>
  <div class="field">
    <label for="apiKey">API key</label>
    <input type="text" id="apiKey" placeholder="(none required)">
  </div>
  <button class="small" id="closeSettings" style="display:none">Close</button>
</aside>

<div class="modal" id="preview" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <span>HTML preview · sandboxed</span>
      <div class="spacer"></div>
      <button class="small" id="previewTab">Open in new tab</button>
      <button class="small" id="previewClose">Close</button>
    </div>
    <iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups"
            referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const log = $("log"), wrap = $("wrap"), input = $("input");

// The conversation. Assistant turns keep the raw text including <think>; the
// server strips reasoning from earlier turns itself, like the chat template.
let turns = [];          // {role, content, el}
let controller = null;   // AbortController for the in-flight request
let props = {};

// --- settings ---------------------------------------------------------------
const CONTROLS = ["temp", "top_p", "top_k", "min_p", "rep", "maxTok", "seed", "sys", "apiKey", "think"];

function loadSettings() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("airun.settings") || "{}"); } catch (_) {}
  for (const id of CONTROLS) {
    if (saved[id] === undefined || saved[id] === null) continue;
    if ($(id).type === "checkbox") $(id).checked = !!saved[id]; else $(id).value = saved[id];
  }
  syncLabels();
}
function saveSettings() {
  const out = {};
  for (const id of CONTROLS) out[id] = $(id).type === "checkbox" ? $(id).checked : $(id).value;
  try { localStorage.setItem("airun.settings", JSON.stringify(out)); } catch (_) {}
}
function syncLabels() {
  $("tempV").textContent  = (+$("temp").value).toFixed(2);
  $("top_pV").textContent = (+$("top_p").value).toFixed(2);
  $("top_kV").textContent = $("top_k").value;
  $("min_pV").textContent = (+$("min_p").value).toFixed(2);
  $("repV").textContent   = (+$("rep").value).toFixed(2);
  $("thinkPill").classList.toggle("on", $("think").checked);
}
for (const id of CONTROLS) {
  $(id).addEventListener("input", () => { syncLabels(); saveSettings(); });
  $(id).addEventListener("change", () => { syncLabels(); saveSettings(); });
}

// --- markdown ---------------------------------------------------------------
// Everything the model writes is escaped first; only the tags built here reach
// innerHTML, so model output cannot inject markup into this page. HTML the
// model writes is shown as code and can be previewed in a sandboxed frame.

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

function inline(src) {
  const codes = [];
  let s = src.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (m, text, url) =>
    /^(https?:|mailto:)/i.test(url)
      ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>` : m);
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g,
    '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, "$1<strong>$2</strong>");
  s = s.replace(/(^|[^*\w])\*(?=[^\s*])([^*\n]*?[^\s*])\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^\w])_(?=[^\s_])([^_\n]*?[^\s_])_(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
}

const FENCE = /^ {0,3}(`{3,}|~{3,})\s*([^\s`]*)/;
const LIST = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
const TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const HTML_LANGS = new Set(["html", "htm", "xhtml", "svg"]);

function isHtml(lang, code) {
  return HTML_LANGS.has(lang.toLowerCase()) || /^\s*(<!doctype html|<html[\s>]|<svg[\s>])/i.test(code);
}

function codeBlock(lang, code) {
  const preview = isHtml(lang, code)
    ? '<button class="small" data-act="preview">Preview</button>' +
      '<button class="small" data-act="open">Open</button>' : "";
  return `<div class="codeblock"><div class="codehead"><span class="lang">${esc(lang || "text")}</span>` +
    `${preview}<button class="small" data-act="copy-code">Copy</button></div>` +
    `<pre><code>${esc(code)}</code></pre></div>`;
}

function splitRow(line) {
  let l = line.trim();
  if (l.startsWith("|")) l = l.slice(1);
  if (l.endsWith("|") && !l.endsWith("\\|")) l = l.slice(0, -1);
  return l.split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
}

function blockStart(line) {
  return FENCE.test(line) || /^ {0,3}#{1,6}\s/.test(line) || /^\s*>/.test(line) ||
         LIST.test(line) || /^\s*([-*_])(\s*\1){2,}\s*$/.test(line);
}

function markdown(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    const fence = line.match(FENCE);
    if (fence) {
      const mark = fence[1], body = [];
      i++;
      // An unclosed fence runs to the end: that is what a stream mid-code looks like.
      while (i < lines.length && !new RegExp("^ {0,3}" + mark[0] + "{" + mark.length + ",}\\s*$").test(lines[i])) {
        body.push(lines[i++]);
      }
      i++;
      out.push(codeBlock(fence[2] || "", body.join("\n")));
      continue;
    }

    const h = line.match(/^ {0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }

    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

    if (/^\s*>/.test(line)) {
      const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*> ?/, ""));
      out.push(`<blockquote>${markdown(body.join("\n"))}</blockquote>`);
      continue;
    }

    if (line.includes("|") && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1])) {
      const head = splitRow(line);
      const align = splitRow(lines[i + 1]).map((c) =>
        c.startsWith(":") && c.endsWith(":") ? "center" : c.endsWith(":") ? "right" : "");
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(splitRow(lines[i++]));
      const cell = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ""}>${inline(c)}</${tag}>`;
      out.push("<table><thead><tr>" + head.map((c, k) => cell("th", c, k)).join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + head.map((_, k) => cell("td", r[k] || "", k)).join("") + "</tr>").join("") +
        "</tbody></table>");
      continue;
    }

    const li = line.match(LIST);
    if (li) {
      const indent = li[1].length;
      const ordered = /\d/.test(li[2]);
      const start = ordered ? parseInt(li[2], 10) : 1;
      const items = [];
      while (i < lines.length) {
        const m = lines[i].match(LIST);
        if (m && m[1].length === indent && /\d/.test(m[2]) === ordered) {
          items.push([m[3]]);
          i++;
        } else if (items.length && lines[i].trim() &&
                   (lines[i].match(/^\s*/)[0].length > indent || !blockStart(lines[i]))) {
          // Deeper lines belong to the item: nested lists, wrapped text.
          items[items.length - 1].push(lines[i].slice(Math.min(indent + 2, lines[i].match(/^\s*/)[0].length)));
          i++;
        } else if (!lines[i].trim() && i + 1 < lines.length &&
                   (lines[i + 1].match(/^\s*/)[0].length > indent ||
                    (lines[i + 1].match(LIST) || [])[1]?.length === indent)) {
          i++;  // a blank line inside a loose list
        } else {
          break;
        }
      }
      const tag = ordered ? "ol" : "ul";
      const attr = ordered && start !== 1 ? ` start="${start}"` : "";
      out.push(`<${tag}${attr}>` + items.map((it) => {
        const [first, ...rest] = it;
        const nested = rest.length ? markdown(rest.join("\n")) : "";
        return `<li>${inline(first)}${nested}</li>`;
      }).join("") + `</${tag}>`);
      continue;
    }

    const para = [];
    while (i < lines.length && lines[i].trim() && !blockStart(lines[i]) &&
           !(lines[i].includes("|") && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1]))) {
      para.push(lines[i++]);
    }
    if (!para.length) para.push(lines[i++]);
    // Chat models use single newlines as line breaks, not as reflowable text.
    out.push(`<p>${para.map((l) => inline(l.trim())).join("<br>")}</p>`);
  }
  return out.join("");
}

// --- reasoning --------------------------------------------------------------

// Splits "<think>…</think>answer". Models whose prompt opens the block get
// "<think>" echoed by the server, so both halves arrive in the content.
function splitThink(raw) {
  const open = raw.indexOf("<think>");
  const close = raw.indexOf("</think>");
  if (close !== -1 && (open === -1 || open < close)) {
    const from = open === -1 ? 0 : open + 7;
    return { think: raw.slice(from, close).trim(), answer: raw.slice(close + 8).replace(/^\s+/, ""), live: false };
  }
  if (open !== -1 && !raw.slice(0, open).trim()) {
    return { think: raw.slice(open + 7).replace(/^\s+/, ""), answer: "", live: true };
  }
  return { think: null, answer: raw, live: false };
}

// --- messages ---------------------------------------------------------------

function showEmpty() {
  wrap.innerHTML = '<div class="empty" id="empty"><h2>Nothing yet</h2>' +
    '<p>Enter sends, Shift+Enter makes a new line, Esc stops a reply.</p></div>';
}

function actionButton(label, act, needsIdle) {
  const b = document.createElement("button");
  b.textContent = label;
  b.dataset.act = act;
  if (needsIdle) b.className = "needs-idle";
  return b;
}

function addMessage(role, text) {
  $("empty")?.remove();
  const msg = document.createElement("div");
  msg.className = "msg " + role;
  const r = document.createElement("div");
  r.className = "role";
  r.textContent = role;
  const b = document.createElement("div");
  b.className = "bubble";
  msg.append(r, b);

  if (role === "assistant") {
    const think = document.createElement("details");
    think.className = "think";
    think.hidden = true;
    think.innerHTML = '<summary></summary><div class="think-body md"></div>';
    // "toggle" also fires for changes made by code; only a click is a choice.
    think.addEventListener("toggle", () => {
      if (think.dataset.auto) delete think.dataset.auto; else think.dataset.touched = "1";
    });
    const answer = document.createElement("div");
    answer.className = "answer md";
    b.append(think, answer);
  } else {
    b.textContent = text;
  }

  if (role !== "error") {
    const acts = document.createElement("div");
    acts.className = "actions";
    acts.append(actionButton("Copy", "copy"));
    if (role === "user") acts.append(actionButton("Edit", "edit", true));
    if (role === "assistant") acts.append(actionButton("Regenerate", "regen", true));
    msg.append(acts);
  }
  wrap.appendChild(msg);
  return msg;
}

function renderAssistant(msg, raw, state) {
  const { think, answer, live } = splitThink(raw);
  const t = msg.querySelector("details.think");
  const a = msg.querySelector(".answer");
  if (think !== null) {
    t.hidden = false;
    t.querySelector(".think-body").innerHTML = markdown(think) || "<p>…</p>";
    t.classList.toggle("live", live && state.streaming);
    const secs = state.thinkEnd ? ((state.thinkEnd - state.thinkStart) / 1000).toFixed(1) : null;
    t.querySelector("summary").textContent =
      live && state.streaming ? "Thinking…" :
      live && state.stopped ? `Stopped while thinking (${secs} s)` :
      secs ? `Thought for ${secs} s` : "Reasoning";
    // Open while thinking, fold once the answer starts, unless the user chose.
    const want = live && state.streaming;
    if (!t.dataset.touched && t.open !== want) {
      t.dataset.auto = "1";
      t.open = want;
    }
  } else {
    t.hidden = true;
  }
  a.innerHTML = markdown(answer);
  a.classList.toggle("cursor", state.streaming && !live);
  if (state.streaming && live) t.querySelector(".think-body").classList.add("cursor");
  else t.querySelector(".think-body").classList.remove("cursor");
}

function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }

// --- generation -------------------------------------------------------------

function busy(on) {
  document.body.classList.toggle("busy", on);
  $("send").hidden = on;
  $("stop").hidden = !on;
  if (!on) input.focus();
}

function submit() {
  const text = input.value.trim();
  if (!text || controller) return;
  input.value = ""; input.style.height = "auto";
  const el = addMessage("user", text);
  turns.push({ role: "user", content: text, el });
  log.scrollTop = log.scrollHeight;
  generate();
}

async function generate() {
  const msg = addMessage("assistant", "");
  const turn = { role: "assistant", content: "", el: msg };
  const state = { streaming: true, thinkStart: performance.now(), thinkEnd: null };
  renderAssistant(msg, "", state);
  log.scrollTop = log.scrollHeight;
  busy(true);

  const messages = [];
  const sys = $("sys").value.trim();
  if (sys) messages.push({ role: "system", content: sys });
  for (const t of turns) messages.push({ role: t.role, content: t.content });

  const thinking = $("think").checked;
  const body = {
    model: props.model || "airun",
    messages,
    stream: true,
    max_tokens: +$("maxTok").value || 2048,
    temperature: +$("temp").value,
    top_p: +$("top_p").value,
    top_k: +$("top_k").value,
    min_p: +$("min_p").value,
    frequency_penalty: Math.max(0, +$("rep").value - 1),
    enable_thinking: thinking,
    chat_template_kwargs: { enable_thinking: thinking },
  };
  const seed = $("seed").value.trim();
  if (seed !== "" && !Number.isNaN(+seed)) body.seed = +seed;

  const headers = { "Content-Type": "application/json" };
  const key = $("apiKey").value.trim();
  if (key) headers["Authorization"] = "Bearer " + key;

  controller = new AbortController();
  const t0 = performance.now();
  let acc = "", firstTokenAt = null, nChunks = 0, pending = false, stopped = false;
  // The server streams the thinking as reasoning_content (llama-server's
  // shape); it is put back in <think> form, which the rest of the page splits.
  let reasoning = "", content = "";

  // Re-rendering markdown per chunk is wasted work; once per frame is enough.
  const paint = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const stick = atBottom();
      renderAssistant(msg, acc, state);
      if (stick) log.scrollTop = log.scrollHeight;
    });
  };

  try {
    const res = await fetch("./v1/chat/completions", {
      method: "POST", headers, body: JSON.stringify(body), signal: controller.signal,
    });
    if (!res.ok) {
      let detail = "HTTP " + res.status;
      try { const j = await res.json(); if (j?.error?.message) detail = j.error.message; } catch (_) {}
      throw new Error(detail);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // SSE frames are separated by a blank line; keep the partial tail.
      const frames = buf.split("\n\n");
      buf = frames.pop();
      for (const frame of frames) {
        for (const line of frame.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (payload === "[DONE]") continue;
          let j;
          try { j = JSON.parse(payload); } catch (_) { continue; }
          if (j.error) throw new Error(j.error.message || "server error");
          const delta = j.choices?.[0]?.delta || {};
          const thought = delta.reasoning_content, piece = delta.content;
          if (!thought && !piece) continue;
          if (firstTokenAt === null) firstTokenAt = performance.now();
          nChunks++;
          if (thought) reasoning += thought;
          if (piece) content += piece;
          acc = reasoning ? "<think>\n" + reasoning + (content ? "\n</think>\n\n" + content : "") : content;
          if (state.thinkEnd === null && acc.includes("</think>")) state.thinkEnd = performance.now();
          paint();
        }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") {
      stopped = true;
      state.stopped = true;
    } else {
      msg.remove();
      const err = addMessage("error", String(e.message || e));
      err.querySelector(".bubble").textContent = String(e.message || e);
      controller = null;
      busy(false);
      return;
    }
  }

  controller = null;
  state.streaming = false;
  if (state.thinkEnd === null && splitThink(acc).think !== null) state.thinkEnd = performance.now();
  renderAssistant(msg, acc, state);

  if (!acc) {
    msg.remove();              // stopped before anything arrived
  } else {
    turn.content = acc;
    turns.push(turn);
    const now = performance.now();
    const ttft = firstTokenAt === null ? 0 : firstTokenAt - t0;
    const genMs = firstTokenAt === null ? 0 : now - firstTokenAt;
    const tps = genMs > 0 ? (nChunks - 1) / (genMs / 1000) : 0;
    const stats = document.createElement("div");
    stats.className = "stats";
    stats.textContent = `${nChunks} tokens · first token ${ttft.toFixed(0)} ms · ` +
      `${tps.toFixed(1)} tok/s · ${((now - t0) / 1000).toFixed(2)} s` + (stopped ? " · stopped" : "");
    msg.querySelector(".bubble").after(stats);
  }
  busy(false);
}

function stop() { controller?.abort(); }

// Drops turn `index` and everything after it, in the transcript and on screen.
function truncateAt(index) {
  for (const t of turns.slice(index)) t.el.remove();
  turns = turns.slice(0, index);
  wrap.querySelectorAll(".msg.error").forEach((e) => e.remove());
}

function startEdit(turnIndex) {
  const turn = turns[turnIndex];
  const bubble = turn.el.querySelector(".bubble");
  if (bubble.querySelector(".edit-box")) return;
  const box = document.createElement("textarea");
  box.className = "edit-box";
  box.value = turn.content;
  const row = document.createElement("div");
  row.className = "edit-row";
  const cancel = document.createElement("button");
  cancel.className = "small"; cancel.textContent = "Cancel";
  const save = document.createElement("button");
  save.className = "small primary"; save.textContent = "Send";
  row.append(cancel, save);
  bubble.textContent = "";
  bubble.append(box, row);
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);

  const restore = () => { bubble.textContent = turn.content; };
  const commit = () => {
    const text = box.value.trim();
    if (!text || controller) return;
    truncateAt(turnIndex);
    const el = addMessage("user", text);
    turns.push({ role: "user", content: text, el });
    generate();
  };
  cancel.addEventListener("click", restore);
  save.addEventListener("click", commit);
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commit(); }
    if (e.key === "Escape") { e.preventDefault(); restore(); }
  });
}

// --- clipboard and preview --------------------------------------------------

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    // Plain-http origins other than localhost have no async clipboard.
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (_) {}
    t.remove();
  }
  if (button) {
    const old = button.textContent;
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = old; }, 1200);
  }
}

let previewHtml = "";

function openPreview(html) {
  previewHtml = html;
  $("previewFrame").srcdoc = html;
  $("preview").hidden = false;
}

// A new tab gets a wrapper page whose only content is the same sandboxed frame,
// so the model's HTML never runs with this page's origin (and its API access).
function openInTab(html) {
  const page = '<!doctype html><meta charset="utf-8"><title>airun preview</title>' +
    '<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style>' +
    '<iframe sandbox="allow-scripts allow-forms allow-modals allow-popups" srcdoc="' +
    esc(html) + '"></iframe>';
  const url = URL.createObjectURL(new Blob([page], { type: "text/html" }));
  window.open(url, "_blank", "noopener");
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// --- events -----------------------------------------------------------------

$("send").addEventListener("click", submit);
$("stop").addEventListener("click", stop);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 220) + "px";
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("preview").hidden) { $("preview").hidden = true; return; }
  if (controller) { e.preventDefault(); stop(); }
});

wrap.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const msg = btn.closest(".msg");
  const index = turns.findIndex((t) => t.el === msg);
  const act = btn.dataset.act;

  if (act === "copy-code" || act === "preview" || act === "open") {
    const code = btn.closest(".codeblock").querySelector("code").textContent;
    if (act === "copy-code") copyText(code, btn);
    else if (act === "preview") openPreview(code);
    else openInTab(code);
    return;
  }
  if (index < 0) return;
  if (act === "copy") {
    const t = turns[index];
    copyText(t.role === "assistant" ? splitThink(t.content).answer : t.content, btn);
  } else if (act === "edit" && !controller) {
    startEdit(index);
  } else if (act === "regen" && !controller) {
    truncateAt(index);
    generate();
  }
});

$("previewClose").addEventListener("click", () => { $("preview").hidden = true; });
$("previewTab").addEventListener("click", () => openInTab(previewHtml));
$("preview").addEventListener("click", (e) => { if (e.target === $("preview")) $("preview").hidden = true; });

$("newChat").addEventListener("click", () => {
  stop();
  turns = [];
  showEmpty();
  input.focus();
});

$("settingsBtn").addEventListener("click", () => {
  $("aside").classList.add("open");
  $("closeSettings").style.display = "";
});
$("closeSettings").addEventListener("click", () => {
  $("aside").classList.remove("open");
  $("closeSettings").style.display = "none";
});

// --- server info ------------------------------------------------------------

async function connect() {
  try {
    const res = await fetch("./props");
    if (!res.ok) throw new Error("HTTP " + res.status);
    props = await res.json();

    $("dot").className = "dot ok";
    $("modelName").textContent = props.model || "";
    $("maxTok").max = props.ctx || 32768;
    $("thinkPill").hidden = !props.thinking;

    const rows = [
      ["arch", props.arch],
      ["layers", props.n_layers],
      ["context", props.ctx],
      ["vocab", props.vocab_size],
      ["gpus", (props.gpus || []).join(", ") || "-"],
      ["reasoning", props.thinking ? "yes" : "no"],
      ["auth", props.auth_required ? "api key" : "open"],
    ];
    $("info").innerHTML = "";
    for (const [k, v] of rows) {
      if (v === undefined || v === null || v === "") continue;
      const d = document.createElement("div");
      const a = document.createElement("span"); a.textContent = k;
      const b = document.createElement("span"); b.textContent = String(v);
      d.append(a, b);
      $("info").appendChild(d);
    }
  } catch (e) {
    $("dot").className = "dot err";
    $("modelName").textContent = "server unreachable";
  }
}

showEmpty();
loadSettings();
connect();
input.focus();
</script>
</body>
</html>
